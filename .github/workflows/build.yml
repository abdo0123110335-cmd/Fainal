name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Regenerate Android Project & Clean SDK Config
        run: |
          flutter create . --platforms=android --org com.elsheikhcustoms

          mkdir -p android/app
          echo "flutter.compileSdkVersion=36" > android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

          # تعديل ملف build.gradle.kts بشكل نظيف وآمن لتجنب تداخل الرموز
          python3 - << 'PYEOF'
          import os, re

          path = "android/app/build.gradle.kts"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # إزالة الأسطر القديمة الخاصة بالـ SDK لمنع التداخل
              content = re.sub(r'compileSdk\s*=.*', '', content)
              content = re.sub(r'compileSdkVersion\s*=.*', '', content)
              content = re.sub(r'targetSdk\s*=.*', '', content)
              content = re.sub(r'targetSdkVersion\s*=.*', '', content)
              content = re.sub(r'minSdk\s*=.*', '', content)
              content = re.sub(r'minSdkVersion\s*=.*', '', content)

              # حقن القيم الصحيحة داخل bloc الـ android {}
              replacement = """
                  compileSdk = 36
                  defaultConfig {
                      minSdk = 21
                      targetSdk = 36
              """
              content = re.sub(r'android\s*\{', 'android {' + replacement, content, count=1)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Cleaned and updated build.gradle.kts successfully.")
          PYEOF

          # إصلاح ملف AndroidManifest.xml وإزالة الـ v1 embedding
          python3 - << 'PYEOF'
          import os, re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()

              content = re.sub(r'android:name="io\.flutter\.app\.FlutterApplication"', '', content)
              
              if "flutterEmbedding" not in content:
                  content = content.replace("<application", '<application\n        android:name="${applicationName}"')
                  content = re.sub(r'(</application>)', r'    <meta-data\n        android:name="flutterEmbedding"\n        android:value="2" />\n\1', content)

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
          PYEOF

          # ضبط إعدادات الـ Subprojects لـ share_plus
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              project.evaluationDependsOn(':app')
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (compileSdkVersion == null || compileSdkVersion.toString() < '34' || compileSdkVersion.toString() == 'android-33') {
                              compileSdkVersion 36
                          }
                      }
                  }
              }
          }
          EOF

      - name: Write Firebase configuration (google-services.json + firebase_options.dart)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::سر GOOGLE_SERVICES_JSON غير موجود في مستودع GitHub."
            exit 1
          fi
          
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          python3 - << 'PYEOF'
          import os, re

          if os.path.exists("android/settings.gradle.kts"):
              path = "android/settings.gradle.kts"
              content = open(path, encoding="utf-8").read()
              if "com.google.gms.google-services" not in content:
                  content = re.sub(r"(plugins\s*\{\n)", r'\1    id("com.google.gms.google-services") version "4.4.2" apply false\n', content, count=1)
                  open(path, "w", encoding="utf-8").write(content)

          for app_path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(app_path):
                  content = open(app_path, encoding="utf-8").read()
                  is_kts = app_path.endswith(".kts")
                  plugin_line = '    id("com.google.gms.google-services")\n' if is_kts else "    id 'com.google.gms.google-services'\n"
                  if "google-services" not in content:
                      content = re.sub(r"(plugins\s*\{\n)", r"\1" + plugin_line, content, count=1)
                      open(app_path, "w", encoding="utf-8").write(content)
                  break
          PYEOF

          python3 - << 'PYEOF'
          import json, os
          if os.path.exists("android/app/google-services.json"):
              with open("android/app/google-services.json", encoding="utf-8") as f:
                  data = json.load(f)
              project_info = data["project_info"]
              client = data["client"][0]
              app_id = client["client_info"]["mobilesdk_app_id"]
              api_key = client["api_key"][0]["current_key"]
              project_id = project_info["project_id"]
              sender_id = project_info["project_number"]
              storage_bucket = project_info.get("storage_bucket", f"{project_id}.appspot.com")

              content = f'''import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
              import 'package:flutter/foundation.dart' show kIsWeb, defaultTargetPlatform, TargetPlatform;
              class DefaultFirebaseOptions {{
                static FirebaseOptions get currentPlatform {{
                  if (kIsWeb) {{ throw UnsupportedError('Web not supported'); }}
                  switch (defaultTargetPlatform) {{
                    case TargetPlatform.android: return android;
                    default: throw UnsupportedError('Platform not supported');
                  }}
                }}
                static const FirebaseOptions android = FirebaseOptions(
                  apiKey: '{api_key}', appId: '{app_id}', messagingSenderId: '{sender_id}',
                  projectId: '{project_id}', storageBucket: '{storage_bucket}',
                );
              }}
              '''
              os.makedirs("lib", exist_ok=True)
              with open("lib/firebase_options.dart", "w", encoding="utf-8") as f:
                  f.write(content)
          PYEOF

      - name: Add camera & storage permissions to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<manifest xmlns:android/a\    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />' "$MANIFEST"
          fi

      - name: Add ProGuard rules for ML Kit text recognition
        run: |
          mkdir -p android/app
          PROGUARD=android/app/proguard-rules.pro
          touch "$PROGUARD"
          cat >> "$PROGUARD" << 'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -keep class com.google.mlkit.vision.text.** { *; }
          -keep class com.google.mlkit.vision.text.latin.** { *; }
          EOF

      - name: Disable R8 code shrinking for a stable release build
        run: |
          python3 - << 'PYEOF'
          import os, re
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(path):
                  is_kts = path.endswith(".kts")
                  with open(path, "r", encoding="utf-8") as f: content = f.read()
                  if is_kts:
                      content = re.sub(r"isMinifyEnabled\s*=\s*true", "isMinifyEnabled = false", content)
                      content = re.sub(r"isShrinkResources\s*=\s*true", "isShrinkResources = false", content)
                      if "isMinifyEnabled" not in content:
                          match = re.search(r"release\s*\{", content)
                          if match: content = content[:match.end()] + "\n            isMinifyEnabled = false\n            isShrinkResources = false" + content[match.end():]
                  else:
                      content = re.sub(r"minifyEnabled\s+true", "minifyEnabled false", content)
                      content = re.sub(r"shrinkResources\s+true", "shrinkResources false", content)
                      if "minifyEnabled" not in content:
                          match = re.search(r"release\s*\{", content)
                          if match: content = content[:match.end()] + "\n            minifyEnabled false\n            shrinkResources false" + content[match.end():]
                  with open(path, "w", encoding="utf-8") as f: content = f.write(content)
          PYEOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Find and Move APK if needed
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            FOUND_APK=$(find . -path "*/build/app/outputs/apk/release/*.apk" -o -name "app-release.apk" | head -n 1)
            if [ -n "$FOUND_APK" ]; then
              cp "$FOUND_APK" build/app/outputs/flutter-apk/app-release.apk
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
