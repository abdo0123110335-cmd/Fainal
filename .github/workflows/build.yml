name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --project-name elsheikh_customs_app \
              .
          fi

      - name: Fix Android Gradle Configuration
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Detecting Android Gradle files"
          echo "======================================"

          find android -type f \( \
            -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) -print

          # -------------------------------------------------
          # Kotlin DSL: android/app/build.gradle.kts
          # -------------------------------------------------
          if [ -f "android/app/build.gradle.kts" ]; then

            echo "Found Kotlin DSL:"
            echo "android/app/build.gradle.kts"

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          text = p.read_text(encoding="utf-8")

          # Remove any previous/broken compileSdk declarations.
          text = re.sub(
              r'^[ \t]*compileSdkVersion[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*compileSdk[ \t]*=[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*compileSdk[ \t]+[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # Insert the correct Kotlin DSL syntax.
          match = re.search(r'android\s*\{', text)

          if not match:
              raise SystemExit(
                  "ERROR: android { block not found."
              )

          pos = match.end()

          text = (
              text[:pos]
              + "\n    compileSdk = 36"
              + text[pos:]
          )

          # Disable R8/minification if enabled.
          text = re.sub(
              r'isMinifyEnabled\s*=\s*true',
              'isMinifyEnabled = false',
              text
          )

          text = re.sub(
              r'isShrinkResources\s*=\s*true',
              'isShrinkResources = false',
              text
          )

          p.write_text(text, encoding="utf-8")

          print("===== FINAL build.gradle.kts =====")
          print(text)
          PY

          fi

          # -------------------------------------------------
          # Groovy: android/app/build.gradle
          # -------------------------------------------------
          if [ -f "android/app/build.gradle" ]; then

            echo "Found Groovy:"
            echo "android/app/build.gradle"

            python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          text = p.read_text(encoding="utf-8")

          text = re.sub(
              r'^[ \t]*compileSdkVersion[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*compileSdk[ \t]*=[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^[ \t]*compileSdk[ \t]+[^\n]*\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          match = re.search(r'android\s*\{', text)

          if not match:
              raise SystemExit(
                  "ERROR: android { block not found."
              )

          pos = match.end()

          text = (
              text[:pos]
              + "\n    compileSdk 36"
              + text[pos:]
          )

          text = re.sub(
              r'minifyEnabled\s+true',
              'minifyEnabled false',
              text
          )

          text = re.sub(
              r'shrinkResources\s+true',
              'shrinkResources false',
              text
          )

          p.write_text(text, encoding="utf-8")

          print("===== FINAL build.gradle =====")
          print(text)
          PY

          fi

          # -------------------------------------------------
          # Gradle properties
          # -------------------------------------------------
          touch android/gradle.properties

          if ! grep -q \
            "^android.suppressUnsupportedCompileSdk=36$" \
            android/gradle.properties; then

            echo "android.suppressUnsupportedCompileSdk=36" \
              >> android/gradle.properties

          fi

          echo "======================================"
          echo "FINAL COMPILE SDK CHECK"
          echo "======================================"

          grep -RniE \
            "compileSdk|compileSdkVersion" \
            android/app \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            || true

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove default test
        run: |
          rm -f test/widget_test.dart || true

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos

      - name: Clean Flutter
        run: |
          flutter clean
          flutter pub get

      - name: Verify compileSdk
        shell: bash
        run: |
          set -e

          if [ -f "android/app/build.gradle.kts" ]; then

            echo "Checking Kotlin Gradle file..."

            grep -n "compileSdk" \
              android/app/build.gradle.kts

            if ! grep -q \
              "compileSdk = 36" \
              android/app/build.gradle.kts; then

              echo "ERROR: compileSdk = 36 was not found!"
              exit 1
            fi

            if grep -q \
              "compileSdkVersion" \
              android/app/build.gradle.kts; then

              echo "ERROR: Groovy compileSdkVersion syntax still exists!"
              exit 1
            fi

          fi

          if [ -f "android/app/build.gradle" ]; then

            echo "Checking Groovy Gradle file..."

            grep -nE \
              "compileSdk|compileSdkVersion" \
              android/app/build.gradle

          fi

          echo "Android compileSdk configuration OK."

      - name: Build Release APK
        run: |
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elsheikh-customs-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
