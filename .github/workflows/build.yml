name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          flutter --version

          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name elsheikh_customs_app .
          fi

      - name: Configure Firebase and Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: Missing GitHub Secret GOOGLE_SERVICES_JSON"
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path("android/app/google-services.json").read_text())
          project = data["project_info"]
          client = data["client"][0]
          ci = client["client_info"]
          android = ci["android_client_info"]

          package_name = android["package_name"]
          api_key = client["api_key"][0]["current_key"]
          project_id = project["project_id"]
          sender_id = project["project_number"]
          app_id = ci["mobilesdk_app_id"]
          storage_bucket = project.get("storage_bucket") or f"{project_id}.appspot.com"

          print("Firebase project:", project_id)
          print("Android package:", package_name)

          # Configure the package/namespace in either Gradle format.
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              p = groovy
              s = p.read_text()
              s = re.sub(r'namespace\\s+[\'"][^\'"]+[\'"]',
                         f'namespace "{package_name}"', s, count=1)
              s = re.sub(r'applicationId\\s+[\'"][^\'"]+[\'"]',
                         f'applicationId "{package_name}"', s, count=1)
              # Flutter generated projects normally use flutter.compileSdkVersion.
              s = re.sub(r'compileSdk\\s+flutter\\.compileSdkVersion',
                         'compileSdk 36', s, count=1)
              s = re.sub(r'compileSdkVersion\\s+flutter\\.compileSdkVersion',
                         'compileSdkVersion 36', s, count=1)
              p.write_text(s)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              s = re.sub(r'namespace\\s*=\\s*"[^"]+"',
                         f'namespace = "{package_name}"', s, count=1)
              s = re.sub(r'applicationId\\s*=\\s*"[^"]+"',
                         f'applicationId = "{package_name}"', s, count=1)
              s = re.sub(r'compileSdk\\s*=\\s*flutter\\.compileSdkVersion',
                         'compileSdk = 36', s, count=1)
              p.write_text(s)
          else:
              raise SystemExit("Android app Gradle file was not found")

          # Update AndroidManifest package only if an old package declaration exists.
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              s = manifest.read_text()
              s = re.sub(r'package="[^"]+"', f'package="{package_name}"', s, count=1)
              manifest.write_text(s)

          # Firebase Flutter options are supplied directly to firebase_core,
          # so the Google Services Gradle plugin is not required here.
          def dart_string(v):
              return "'" + str(v).replace("\\", "\\\\").replace("'", "\\'") + "'"

          dart = f"""import 'package:firebase_core/firebase_core.dart' show FirebaseOptions; import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform; class DefaultFirebaseOptions {{ static FirebaseOptions get currentPlatform {{ if (kIsWeb) {{ throw UnsupportedError('This app is configured for Android only.'); }} switch (defaultTargetPlatform) {{ case TargetPlatform.android: return android; default: throw UnsupportedError('This app is configured for Android only.'); }} }} static const FirebaseOptions android = FirebaseOptions( apiKey: {dart_string(api_key)}, appId: {dart_string(app_id)}, messagingSenderId: {dart_string(sender_id)}, projectId: {dart_string(project_id)}, storageBucket: {dart_string(storage_bucket)}, ); }} """
          Path("lib/firebase_options.dart").write_text(dart, encoding="utf-8")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        shell: bash
        run: |
          set -e
          # The repository does not contain a real widget test; avoid the
          # template test generated by `flutter create`.
          rm -f test/widget_test.dart
          flutter analyze --no-fatal-infos

      - name: Build release APK
        shell: bash
        run: |
          set -e
          # --no-shrink avoids R8 removing/looking for optional ML Kit
          # language classes that are not used by this application.
          flutter build apk --release --no-shrink

      - name: Rename APK
        shell: bash
        run: |
          set -e
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/release/elsheikh_customs_app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elsheikh-customs-apk
          path: build/release/elsheikh_customs_app-release.apk
          if-no-files-found: error
          retention-days: 30
