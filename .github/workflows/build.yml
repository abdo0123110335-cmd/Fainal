name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      # The ZIP does not contain an android/ folder, so generate it.
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --project-name elsheikh_customs_app \
              .
          fi

      # IMPORTANT:
      # Force the APP module itself to compile against Android 36.
      # Installing SDK 36 alone is NOT enough.
      - name: Force Android compileSdk 36
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Before patch:"
          echo "========================================"

          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print -exec grep -nE "compileSdk|compileSdkVersion" {} \; || true

          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path("android").rglob("*.gradle"))
          files += list(Path("android").rglob("*.gradle.kts"))

          for p in files:
              text = p.read_text(encoding="utf-8")

              lines = text.splitlines()
              new_lines = []
              found = False

              for line in lines:
                  # Groovy:
                  # compileSdk flutter.compileSdkVersion
                  # compileSdk 33
                  # compileSdkVersion 33
                  if re.search(r"\bcompileSdkVersion\b", line):
                      indent = re.match(r"\s*", line).group(0)
                      new_lines.append(indent + "compileSdkVersion 36")
                      found = True
                      continue

                  if re.search(r"\bcompileSdk\b", line):
                      indent = re.match(r"\s*", line).group(0)

                      if "=" in line:
                          new_lines.append(indent + "compileSdk = 36")
                      else:
                          new_lines.append(indent + "compileSdk 36")

                      found = True
                      continue

                  new_lines.append(line)

              text = "\n".join(new_lines) + "\n"

              # app/build.gradle is the important file.
              if p.as_posix().endswith("android/app/build.gradle"):
                  if not found:
                      match = re.search(r"android\s*\{", text)
                      if match:
                          pos = match.end()
                          text = (
                              text[:pos]
                              + "\n    compileSdk 36"
                              + text[pos:]
                          )

                  # Disable R8/minification for release.
                  text = re.sub(
                      r"minifyEnabled\s+true",
                      "minifyEnabled false",
                      text
                  )

                  text = re.sub(
                      r"shrinkResources\s+true",
                      "shrinkResources false",
                      text
                  )

              # Kotlin DSL
              if p.as_posix().endswith("android/app/build.gradle.kts"):
                  if not found:
                      match = re.search(r"android\s*\{", text)
                      if match:
                          pos = match.end()
                          text = (
                              text[:pos]
                              + "\n    compileSdk = 36"
                              + text[pos:]
                          )

                  text = re.sub(
                      r"isMinifyEnabled\s*=\s*true",
                      "isMinifyEnabled = false",
                      text
                  )

                  text = re.sub(
                      r"isShrinkResources\s*=\s*true",
                      "isShrinkResources = false",
                      text
                  )

              p.write_text(text, encoding="utf-8")

          print("Patched Gradle files:")
          for p in files:
              print(f"\n===== {p} =====")
              print(p.read_text(encoding="utf-8"))
          PY

          # Tell Android Gradle Plugin that compileSdk 36 is intentional.
          touch android/gradle.properties

          if ! grep -q "^android.suppressUnsupportedCompileSdk=36$" \
              android/gradle.properties; then
            echo "android.suppressUnsupportedCompileSdk=36" \
              >> android/gradle.properties
          fi

          echo "========================================"
          echo "FINAL app Gradle configuration:"
          echo "========================================"

          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          fi

          if [ -f android/app/build.gradle.kts ]; then
            cat android/app/build.gradle.kts
          fi

      - name: Configure Firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GitHub Secret GOOGLE_SERVICES_JSON is missing."
            exit 1
          fi

          mkdir -p android/app

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          python3 <<'PY'
          import json
          from pathlib import Path

          src = Path("android/app/google-services.json")
          data = json.loads(src.read_text(encoding="utf-8"))

          project_info = data.get("project_info", {})
          project_number = project_info.get("project_number", "")
          project_id = project_info.get("project_id", "")
          storage_bucket = project_info.get("storage_bucket", "")

          clients = data.get("client", [])
          client = clients[0] if clients else {}

          android_info = {}
          for item in client.get("client_info", {}).items():
              pass

          package_name = ""
          for item in client.get("client_info", {}).get(
              "android_client_info", {}
          ).items():
              pass

          android_client = client.get("client_info", {}).get(
              "android_client_info", {}
          )
          package_name = android_client.get("package_name", "")

          api_key = ""
          for key in client.get("api_key", []):
              if key.get("current_key"):
                  api_key = key["current_key"]
                  break

          firebase_options = f'''// GENERATED FOR CI
          // DO NOT EDIT MANUALLY.

          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {{
            static FirebaseOptions get currentPlatform {{
              return const FirebaseOptions(
                apiKey: '{api_key}',
                appId: '{client.get("client_info", {}).get("mobilesdk_app_id", "")}',
                messagingSenderId: '{project_number}',
                projectId: '{project_id}',
                storageBucket: '{storage_bucket}',
              );
            }}
          }}
          '''

          Path("lib/firebase_options.dart").write_text(
              firebase_options,
              encoding="utf-8"
          )

          print("Firebase configuration generated.")
          print("Firebase project:", project_id)
          print("Android package:", package_name)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Remove broken default Flutter test
        shell: bash
        run: |
          rm -f test/widget_test.dart || true

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos

      - name: Flutter clean
        run: |
          flutter clean
          flutter pub get

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "Checking compileSdk..."

          if [ -f android/app/build.gradle ]; then
            grep -nE "compileSdk|compileSdkVersion" \
              android/app/build.gradle || true

            if grep -Eq \
              "compileSdk(Version)?[[:space:]]+(flutter\.compileSdkVersion|33)" \
              android/app/build.gradle; then
              echo "ERROR: app/build.gradle still uses compileSdk 33."
              exit 1
            fi
          fi

          if [ -f android/app/build.gradle.kts ]; then
            grep -nE "compileSdk|compileSdkVersion" \
              android/app/build.gradle.kts || true

            if grep -Eq \
              "compileSdk[[:space:]]*=[[:space:]]*(flutter\.compileSdkVersion|33)" \
              android/app/build.gradle.kts; then
              echo "ERROR: app/build.gradle.kts still uses compileSdk 33."
              exit 1
            fi
          fi

          echo "compileSdk check passed."

      - name: Build Release APK
        run: |
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elsheikh-customs-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
