name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          flutter --version

          # The uploaded project contains the Flutter/Dart source but may not
          # contain the generated Android folder. Create it if necessary.
          if [ ! -d "android" ]; then
            flutter create \
              --platforms=android \
              --org com.elsheikhcustoms \
              --project-name elsheikh_customs_app \
              .
          fi

      - name: Configure Firebase from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -e

          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GitHub Actions secret GOOGLE_SERVICES_JSON is missing."
            echo "Add the complete google-services.json content as:"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          # Generate lib/firebase_options.dart from google-services.json.
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = Path("android/app/google-services.json")
          data = json.loads(src.read_text(encoding="utf-8"))

          project = data["project_info"]
          client = data["client"][0]
          app = client["client_info"]
          android_info = app["android_client_info"]

          package_name = android_info["package_name"]
          if package_name != "com.elsheikhcustoms.elsheikh_customs_app":
              raise SystemExit(
                  f"Firebase Android package mismatch: {package_name}\n"
                  "Expected: com.elsheikhcustoms.elsheikh_customs_app"
              )

          api_key = client["api_key"][0]["current_key"]
          project_id = project["project_id"]
          sender_id = project["project_number"]
          app_id = app["mobilesdk_app_id"]
          storage_bucket = project.get("storage_bucket") or f"{project_id}.appspot.com"

          dart = f"""import 'package:firebase_core/firebase_core.dart' show FirebaseOptions; import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform; class DefaultFirebaseOptions {{ static FirebaseOptions get currentPlatform {{ if (kIsWeb) {{ throw UnsupportedError( 'This app is configured for Android only.', ); }} switch (defaultTargetPlatform) {{ case TargetPlatform.android: return android; default: throw UnsupportedError( 'This app is configured for Android only.', ); }} }} static const FirebaseOptions android = FirebaseOptions( apiKey: {api_key!r}, appId: {app_id!r}, messagingSenderId: {sender_id!r}, projectId: {project_id!r}, storageBucket: {storage_bucket!r}, ); }} """
          # Fix Python repr quoting for Dart single-quoted strings.
          for value in [api_key, app_id, sender_id, project_id, storage_bucket]:
              if "'" in value:
                  raise SystemExit("Firebase value contains an unsupported single quote.")

          dart = dart.replace(f"'{api_key!r}'", f"'{api_key}'")
          dart = dart.replace(f"'{app_id!r}'", f"'{app_id}'")
          dart = dart.replace(f"'{sender_id!r}'", f"'{sender_id}'")
          dart = dart.replace(f"'{project_id!r}'", f"'{project_id}'")
          dart = dart.replace(f"'{storage_bucket!r}'", f"'{storage_bucket}'")

          Path("lib/firebase_options.dart").write_text(dart, encoding="utf-8")
          print(f"Firebase configured for project: {project_id}")
          print(f"Android package: {package_name}")
          PY

      - name: Configure Google Services Gradle plugin
        shell: bash
        run: |
          set -e

          # Add the Google Services plugin to the Android buildscript when
          # using the traditional Flutter Groovy Gradle template.
          if [ -f "android/build.gradle" ]; then
            if ! grep -q "com.google.gms:google-services" android/build.gradle; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle")
          s = p.read_text()
          line = " classpath 'com.google.gms:google-services:4.4.2'\n"
          if "dependencies {" in s:
              s = s.replace("dependencies {", "dependencies {\n" + line, 1)
          else:
              raise SystemExit("android/build.gradle does not contain a dependencies block")
          p.write_text(s)
          PY
            fi
          fi

          # Apply the plugin in app-level Gradle.
          if [ -f "android/app/build.gradle" ]; then
            if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
              printf '\napply plugin: "com.google.gms.google-services"\n' >> android/app/build.gradle
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Remove Flutter template test
        shell: bash
        run: |
          # flutter create can generate the default widget_test.dart.
          # It references MyApp, while this project uses its own app root.
          # It is not part of the production APK, so remove the template test.
          rm -rf test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: |
          set -e
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/release/elsheikh_customs_app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elsheikh-customs-apk
          path: build/release/elsheikh_customs_app-release.apk
          if-no-files-found: error
          retention-days: 30
